org: guillaumeboussus
service: m200-backend
frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.13
  region: us-east-1
  stage: ${opt:stage, 'dev'}

  # Rol permitido en AWS Academy
  iam:
    role: arn:aws:iam::156529843879:role/LabRole

  environment:
    STAGE: ${self:provider.stage}
    ORDERS_TABLE: ${self:service}-orders-${self:provider.stage}
    CONNECTIONS_TABLE: ${self:service}-connections-${self:provider.stage}
    EVENT_BUS_NAME: default
    WEBSOCKET_ENDPOINT:
      Fn::Join:
        - ''
        - - 'wss://'
          - !Ref WebsocketsApi
          - '.execute-api.'
          - ${self:provider.region}
          - '.amazonaws.com/'
          - ${self:provider.stage}

functions:

  # ------------------------------
  # ORDER CRUD
  # ------------------------------

  createOrder:
    handler: src/functions/order/create.handler
    events:
      - http:
          path: orders
          method: post
          cors: true

  getOrder:
    handler: src/functions/order/get.handler
    events:
      - http:
          path: orders/{orderId}
          method: get
          cors: true

  listOrders:
    handler: src/functions/order/list.handler
    events:
      - http:
          path: orders
          method: get
          cors: true

  updateOrderStatus:
    handler: src/functions/order/updateStatus.handler
    events:
      - http:
          path: orders/{orderId}/status
          method: put
          cors: true

  # ------------------------------
  # MANUAL STATUS UPDATE: READY
  # ------------------------------

  manualMarkOrderReady:
    handler: src/functions/workflow/markOrderReady.handler
    events:
      - http:
          path: orders/{orderId}/ready
          method: post
          cors: true

  # ------------------------------
  # WEBSOCKETS
  # ------------------------------

  websocketConnect:
    handler: src/functions/websocket/connect.handler
    events:
      - websocket:
          route: $connect

  websocketDisconnect:
    handler: src/functions/websocket/disconnect.handler
    events:
      - websocket:
          route: $disconnect

  websocketBroadcast:
    handler: src/functions/websocket/broadcast.handler
    events:
      - eventBridge:
          eventBus: default
          pattern:
            source:
              - order.service
            detail-type:
              - Order Created

  # ------------------------------
  # MINI WORKFLOW — 2 LAMBDAS
  # ------------------------------

  validateOrder:
    handler: src/functions/workflow/validateOrder.handler

  markOrderReady:
    handler: src/functions/workflow/markOrderReady.handler

# ------------------------------
# RESOURCES
# ------------------------------

resources:
  Resources:

    # --------------------------
    # DYNAMODB TABLES
    # --------------------------

    OrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.ORDERS_TABLE}
        AttributeDefinitions:
          - AttributeName: orderId
            AttributeType: S
        KeySchema:
          - AttributeName: orderId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    ConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.CONNECTIONS_TABLE}
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # --------------------------
    # STEP FUNCTION
    # --------------------------

    MiniOrderWorkflow:
      Type: AWS::StepFunctions::StateMachine
      Properties:
        StateMachineName: mini-order-workflow-${self:provider.stage}
        RoleArn: arn:aws:iam::156529843879:role/LabRole
        Definition:
          Comment: "Mini workflow: CREATED → READY"
          StartAt: Validate
          States:

            Validate:
              Type: Task
              Resource:
                Fn::GetAtt:
                  - ValidateOrderLambdaFunction
                  - Arn
              ResultPath: "$.validation"
              Next: MarkReady

            MarkReady:
              Type: Task
              Resource:
                Fn::GetAtt:
                  - MarkOrderReadyLambdaFunction
                  - Arn
              ResultPath: "$.readyResult"
              End: true

    # --------------------------
    # EVENTBRIDGE RULE
    # --------------------------

    MiniOrderWorkflowStarter:
      Type: AWS::Events::Rule
      Properties:
        EventBusName: default
        EventPattern:
          source:
            - "order.service"
          detail-type:
            - "Order Created"
        Targets:
          - Id: "StartMiniWorkflow"
            Arn: !Ref MiniOrderWorkflow
            RoleArn: arn:aws:iam::156529843879:role/LabRole
            InputPath: "$"

org: guillaumeboussus
service: m200-backend
frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.13
  region: us-east-1
  stage: ${opt:stage, 'dev'}

  # USAMOS EL ROL DE AWS ACADEMY
  iam:
    role: arn:aws:iam::156529843879:role/LabRole

  environment:
    STAGE: ${self:provider.stage}
    ORDERS_TABLE: ${self:service}-orders-${self:provider.stage}
    CONNECTIONS_TABLE: ${self:service}-connections-${self:provider.stage}
    EVENT_BUS_NAME: default   # <-- SEGURO, SIEMPRE EXISTE
    WEBSOCKET_ENDPOINT:
      Fn::Join:
        - ''
        - - 'wss://'
          - !Ref WebsocketsApi
          - '.execute-api.'
          - ${self:provider.region}
          - '.amazonaws.com/'
          - ${self:provider.stage}

functions:

  # ------------------------------
  # ORDER CRUD
  # ------------------------------

  createOrder:
    handler: src/functions/order/create.handler
    events:
      - http:
          path: orders
          method: post
          cors: true

  getOrder:
    handler: src/functions/order/get.handler
    events:
      - http:
          path: orders/{orderId}
          method: get
          cors: true

  listOrders:
    handler: src/functions/order/list.handler
    events:
      - http:
          path: orders
          method: get
          cors: true

  updateOrderStatus:
    handler: src/functions/order/updateStatus.handler
    events:
      - http:
          path: orders/{orderId}/status
          method: put
          cors: true

  # ------------------------------
  # WEBSOCKETS
  # ------------------------------

  websocketConnect:
    handler: src/functions/websocket/connect.handler
    events:
      - websocket:
          route: $connect

  websocketDisconnect:
    handler: src/functions/websocket/disconnect.handler
    events:
      - websocket:
          route: $disconnect

  websocketBroadcast:
    handler: src/functions/websocket/broadcast.handler
    events:
      - eventBridge:
          eventBus: default
          pattern:
            source:
              - order.service
            detail-type:
              - Order Created

  # ------------------------------
  # MINI WORKFLOW STEP FUNCTIONS
  # ------------------------------

  validateOrder:
    handler: src/functions/workflow/validateOrder.handler

  markOrderReady:
    handler: src/functions/workflow/markOrderReady.handler


# ------------------------------
# RECURSOS (DynamoDB + StepFunction + Rule)
# ------------------------------

resources:
  Resources:

    # --------------------------
    # DYNAMODB TABLES
    # --------------------------

    OrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.ORDERS_TABLE}
        AttributeDefinitions:
          - AttributeName: orderId
            AttributeType: S
        KeySchema:
          - AttributeName: orderId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    ConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.CONNECTIONS_TABLE}
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST


    # --------------------------
    # ROLE PARA STEP FUNCTION
    # --------------------------

    MiniWorkflowRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: states.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: MiniWorkflowPolicy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                  Resource: "*"


    # --------------------------
    # MINI STEP FUNCTION
    # --------------------------

    MiniOrderWorkflow:
      Type: AWS::StepFunctions::StateMachine
      Properties:
        StateMachineName: mini-order-workflow-${self:provider.stage}
        RoleArn: !GetAtt MiniWorkflowRole.Arn
        Definition:
          Comment: "Mini workflow de validación → READY"
          StartAt: Validate
          States:
            Validate:
              Type: Task
              Resource:
                Fn::GetAtt:
                  - ValidateOrderLambdaFunction
                  - Arn
              Next: MarkReady
            MarkReady:
              Type: Task
              Resource:
                Fn::GetAtt:
                  - MarkOrderReadyLambdaFunction
                  - Arn
              End: true


    # --------------------------
    # ROLE PARA EVENTBRIDGE
    # --------------------------

    EventBridgeInvokeRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: StartExecutionPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: states:StartExecution
                  Resource: "*"


    # --------------------------
    # REGLA: EVENT CREATED → START STEP FUNCTION
    # --------------------------

    MiniOrderWorkflowStarter:
      Type: AWS::Events::Rule
      Properties:
        EventBusName: default
        EventPattern:
          source:
            - "order.service"
          detail-type:
            - "Order Created"
        Targets:
          - Id: "StartMiniWorkflow"
            Arn: !Ref MiniOrderWorkflow
            RoleArn: !GetAtt EventBridgeInvokeRole.Arn
